version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustvault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: trustvault_secret
      POSTGRES_DB: trustvault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault -d trustvault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
